name: Windows build and installer

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run Samy.Core unit tests
        run: dotnet test tests/Samy.Core.Tests/Samy.Core.Tests.csproj --configuration Release

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/Samy/Samy.csproj
      - name: Build
        run: dotnet build src/Samy/Samy.csproj --configuration Release --no-restore

  installer:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download Microsoft Visual C++ x64 runtime prerequisite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dependencies | Out-Null
          Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile dependencies/VC_redist.x64.exe
          if ((Get-Item dependencies/VC_redist.x64.exe).Length -lt 5000000) { throw "VC++ runtime download looks incomplete." }
          $signature = Get-AuthenticodeSignature dependencies/VC_redist.x64.exe
          if ($signature.Status -ne "Valid") { throw "VC++ runtime signature validation failed: $($signature.Status)" }
      - name: Publish self-contained Windows x64 app
        run: dotnet publish src/Samy/Samy.csproj --configuration Release --runtime win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false --output publish/win-x64
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build SAMY Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          & $iscc installer/SAMY.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path artifacts/SAMY-Setup.exe)) { throw "SAMY-Setup.exe was not created." }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAMY-Windows-Installer
          path: artifacts/SAMY-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload portable publish folder
        uses: actions/upload-artifact@v4
        with:
          name: SAMY-Windows-x64-Publish
          path: publish/win-x64/**
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          target_commitish: ${{ github.sha }}
          name: SAMY v0.3.0
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/SAMY-Setup.exe
